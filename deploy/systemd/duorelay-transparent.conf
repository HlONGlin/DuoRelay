# Install as duorelay.service.d/transparent.conf only for --transparent mode.
[Service]
User=root
Group=root
RuntimeDirectory=duorelay
RuntimeDirectoryMode=0750
Environment=XTABLES_LOCKFILE=/run/duorelay/xtables.lock
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
DeviceAllow=/dev/net/tun rw
ReadWritePaths=/run/duorelay @DUORELAY_PREFIX@
