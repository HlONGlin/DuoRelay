# Minimal mihomo configuration for Clash API testing
# This config provides the minimal setup needed to start mihomo and test its Clash API

port: 7890
socks-port: 7891
mixed-port: 10801

allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# Clash API configuration
external-controller: 127.0.0.1:19093
secret: "test123"

# Minimal proxy configuration
proxies:
  - name: "test-ss"
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-256-gcm
    password: "test-password"

proxy-groups:
  - name: "auto"
    type: select
    proxies:
      - DIRECT
      - test-ss
      - REJECT

rules:
  - MATCH,auto
