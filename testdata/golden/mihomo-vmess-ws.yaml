allow-lan: false
dns:
    enable: true
    nameserver:
        - 223.5.5.5
        - 8.8.8.8
log-level: info
mixed-port: 7890
mode: rule
proxies:
    - alpn:
        - h2
        - http/1.1
      alterId: 0
      cipher: auto
      name: SG-VMess-WS
      network: ws
      port: 443
      server: sg.example.com
      servername: www.example.com
      tls: true
      type: vmess
      udp: true
      uuid: 12345678-1234-1234-1234-123456789abc
      ws-opts:
        early-data-header-name: Sec-WebSocket-Protocol
        headers:
            Host: www.example.com
        max-early-data: 2048
        path: /vmess
proxy-groups:
    - name: PROXY
      proxies:
        - DIRECT
        - SG-VMess-WS
      type: select
rules:
    - MATCH,DIRECT
